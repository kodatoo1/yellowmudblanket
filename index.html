<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Yellowmudblanket</title>
<meta name="description" content="Undyed alpaca throw. Waȟpetuwaŋ. 2026.">
<meta name="theme-color" content="#032075">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans:wght@400;500&family=Spectral:wght@200;300;400&display=swap">
<style>
  *, *::before, *::after { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    min-height: 100vh;
    background: oklch(0.958 0.005 240);
    color: oklch(0.245 0.009 250);
    font-family: Spectral, Georgia, serif;
    -webkit-font-smoothing: antialiased;
  }
  a { color: oklch(0.245 0.009 250); text-decoration: none; }
  a:focus-visible, input:focus-visible, button:focus-visible { outline: 2px solid oklch(0.34 0.008 250); outline-offset: 4px; }
  ::selection { background: oklch(0.958 0.005 240); color: #032075; }
  input::placeholder { color: oklch(0.86 0.02 265); }
  .field input:focus-visible, .field button:focus-visible { outline-color: oklch(0.958 0.005 240); }

  .page { min-height: 100vh; padding: clamp(24px, 4vw, 52px); display: flex; flex-direction: column; }
  main { flex: 1; display: flex; align-items: center; justify-content: center; padding: clamp(24px, 5vh, 64px) 0; }
  .field { width: min(100%, 78vh, 640px); aspect-ratio: 1 / 1; container-type: inline-size; background: #032075; color: oklch(0.958 0.005 240); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: clamp(32px, 9cqi, 64px); padding: clamp(24px, 8cqi, 56px); }

  h1 { margin: 0; font-family: Spectral, serif; font-weight: 200; font-size: clamp(11px, 2.6cqi, 17px); line-height: 1; letter-spacing: 0.34em; text-indent: 0.34em; text-transform: uppercase; white-space: nowrap; max-width: 100%; color: oklch(0.958 0.005 240); }

  .small { font-family: 'Noto Sans', sans-serif; font-size: clamp(9px, 0.85vw, 10px); line-height: 1; letter-spacing: 0.26em; text-transform: uppercase; color: oklch(0.495 0.009 250); }
  .field .small { color: oklch(0.86 0.02 265); }

  .access { display: flex; flex-direction: column; align-items: center; gap: 20px; width: min(100%, 340px); }
  form { display: flex; align-items: center; gap: 12px; width: 100%; border-bottom: 1px solid oklch(0.72 0.03 265); padding-bottom: 10px; }
  input { flex: 1; min-width: 0; font-family: Spectral, serif; font-weight: 300; font-size: clamp(14px, 1.2vw, 16px); line-height: 1.4; color: oklch(0.958 0.005 240); background: transparent; border: 0; border-radius: 0; padding: 0; }
  button { flex: none; display: flex; align-items: center; justify-content: flex-end; font-family: Spectral, serif; font-weight: 300; font-size: clamp(15px, 1.3vw, 17px); line-height: 1; color: oklch(0.86 0.02 265); background: transparent; border: 0; border-radius: 0; width: 44px; height: 44px; padding: 0; margin: -14px 0; cursor: pointer; transition: color 200ms ease; }
  button:hover { color: oklch(0.98 0.005 240); }
  .recorded { display: none; width: 100%; text-align: center; font-family: Spectral, serif; font-weight: 300; font-size: clamp(14px, 1.2vw, 16px); line-height: 1.2; padding: 0 0 10px; border-bottom: 1px solid oklch(0.72 0.03 265); color: oklch(0.958 0.005 240); }
  .access.done form { display: none; }
  .access.done .recorded { display: block; }

  .registry { display: flex; flex-wrap: wrap; justify-content: center; gap: 8px clamp(18px, 2.6vw, 34px); }

  footer { display: flex; justify-content: center; align-items: flex-end; }
  footer a { color: oklch(0.495 0.009 250); padding: 12px 14px; margin: -12px -14px; text-decoration: underline; text-decoration-color: transparent; text-underline-offset: 6px; text-decoration-thickness: 0.5px; transition: text-decoration-color 320ms ease; }
  footer a:hover { text-decoration-color: oklch(0.72 0.006 250); }
</style>
</head>
<body>
<div class="page">
  <main>
    <div class="field">
    <h1>Yellowmudblanket</h1>

    <div class="access" id="access">
      <div class="small">First access</div>
      <form id="form" novalidate>
        <input type="email" name="email" required placeholder="Email" aria-label="Email address" autocomplete="email">
        <button type="submit" aria-label="Submit email address">&#8594;</button>
      </form>
      <div class="recorded">Recorded.</div>
    </div>

    <div class="registry small">
      <span>01</span>
      <span>Undyed alpaca</span>
      <span>Throw</span>
      <span>Wa&#x21E;petuwa&#x14A;</span>
      <span>2026</span>
    </div>
    </div>
  </main>

  <footer class="small">
    <a href="https://www.instagram.com/yellowmudblanket/" target="_blank" rel="noopener">Instagram</a>
  </footer>
</div>

<script>
  document.getElementById('form').addEventListener('submit', function (e) {
    e.preventDefault();
    var input = this.querySelector('input');
    if (!input.checkValidity()) { input.focus(); return; }
    // TODO: POST input.value to your form endpoint here.
    document.getElementById('access').classList.add('done');
  });
</script>
</body>
</html>
