<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Yellowmudblanket</title>
<meta name="description" content="Undyed alpaca throw. 2026. Waȟpetuwaŋ.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@300;400;500&family=Noto+Sans:wght@400;500&family=Spectral:wght@200;300;400&display=swap">
<style>
  *, *::before, *::after { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    min-height: 100vh;
    background: oklch(0.958 0.005 240);
    color: oklch(0.245 0.009 250);
    font-family: Barlow, system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  a { color: inherit; text-decoration: none; transition: color 160ms ease; }
  a:hover { color: oklch(0.245 0.009 250); }
  a:active { color: oklch(0.16 0.009 250); }
  a:focus-visible { outline: 2px solid oklch(0.34 0.008 250); outline-offset: 3px; }
  ::selection { background: oklch(0.245 0.009 250); color: oklch(0.958 0.005 240); }

  .page {
    min-height: 100vh;
    display: grid;
    grid-template-rows: auto 1fr auto;
    padding: clamp(28px, 4.4vw, 56px);
    gap: clamp(32px, 5vw, 64px);
  }

  .head {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    gap: 24px;
  }
  .wordmark {
    font-family: Spectral, serif;
    font-weight: 300;
    font-size: clamp(11px, 1.05vw, 13px);
    line-height: 1;
    letter-spacing: 0.34em;
    text-transform: uppercase;
  }
  .social {
    font-size: clamp(9px, 0.85vw, 10px);
    line-height: 1;
    letter-spacing: 0.3em;
    text-transform: uppercase;
    color: oklch(0.465 0.008 250);
  }

  .object {
    display: flex;
    justify-content: center;
    align-items: flex-start;
    gap: clamp(48px, 13vw, 190px);
  }
  .plate {
    width: clamp(220px, 24vw, 300px);
    aspect-ratio: 300 / 386;
    border: 1px solid oklch(0.895 0.005 240);
    overflow: hidden;
    flex: none;
  }
  .plate img { width: 100%; height: 100%; object-fit: contain; display: block; }

  .registry {
    display: flex;
    flex-direction: column;
    gap: 11px;
    text-align: right;
    flex: none;
    margin-top: clamp(24px, 4vw, 48px);
    font-family: 'Noto Sans', sans-serif;
    font-size: clamp(9px, 0.85vw, 10px);
    line-height: 1;
    letter-spacing: 0.26em;
    text-transform: uppercase;
    color: oklch(0.505 0.008 250);
  }

  .foot {
    font-size: clamp(9px, 0.85vw, 10px);
    line-height: 1;
    letter-spacing: 0.24em;
    text-transform: uppercase;
    color: oklch(0.525 0.008 250);
  }

  @media (max-width: 640px) {
    .object {
      flex-direction: column;
      align-items: flex-start;
      gap: 36px;
    }
    .plate { width: 74%; }
    .registry { text-align: left; margin-top: 0; }
  }
</style>
</head>
<body>
<div class="page">
  <header class="head">
    <div class="wordmark">Yellowmudblanket</div>
    <a class="social" href="https://www.instagram.com/yellowmudblanket/" target="_blank" rel="noopener">instagram</a>
  </header>

  <main class="object">
    <div class="plate">
      <img src="assets/throw-05.jpg" alt="Undyed alpaca throw folded over a plain wooden chair" width="896" height="1152">
    </div>
    <div class="registry">
      <span>01</span>
      <span>Undyed alpaca</span>
      <span>Throw</span>
      <span>2026</span>
      <span>WA&#x21E;PETUWA&#x14A;</span>
    </div>
  </main>

  <footer class="foot">&copy; 2026</footer>
</div>
</body>
</html>
